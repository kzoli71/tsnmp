name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local # use exactly the Go version of go.mod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Licenses
        run: go run ./tools/licenses # THIRD_PARTY_LICENSES.txt is up to date

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Static binaries; -trimpath and no -ldflags="-s -w": a stripped exe
      # is more likely flagged by antivirus heuristics (see Readme).
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux-amd64/tsnmp .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows-amd64/tsnmp.exe .
          cp LICENSE THIRD_PARTY_LICENSES.txt Readme.md Readme.hu.md dist/linux-amd64/
          cp LICENSE THIRD_PARTY_LICENSES.txt Readme.md Readme.hu.md dist/windows-amd64/

      - uses: actions/upload-artifact@v4
        with:
          name: tsnmp-linux-amd64
          path: dist/linux-amd64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tsnmp-windows-amd64
          path: dist/windows-amd64/
          if-no-files-found: error
