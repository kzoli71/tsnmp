name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

env:
  GOTOOLCHAIN: local # use the Go installed by setup-go

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the history and the previous tag

      # Release binaries are built with the latest stable Go for its security
      # fixes; the build workflow checks the go.mod minimum.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Licenses
        run: go run ./tools/licenses

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
